# --- Production profile ---
# Point DB_URL at MySQL or PostgreSQL; driver is auto-detected from the URL scheme.
# Examples:
#   MySQL:      jdbc:mysql://<host>:3306/propertywale?useSSL=true&serverTimezone=UTC
#   PostgreSQL: jdbc:postgresql://<host>:5432/propertywale
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/propertywale}
spring.datasource.username=${DB_USERNAME:propertywale}
spring.datasource.password=${DB_PASSWORD:changeme}

# "update" is convenient for early-stage projects; switch to a real migration
# tool (Flyway/Liquibase) plus ddl-auto=validate before going live.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-stacktrace=never

spring.h2.console.enabled=false
