<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — PropertyWale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5" style="max-width: 640px;">
  <h1 class="pw-display h2 mb-1">Contact Us</h1>
  <p class="text-secondary mb-4">Questions about a listing or the platform? Send us a note.</p>

  <form id="contactForm" class="pw-filter-panel vstack gap-3">
    <div>
      <label class="form-label small fw-semibold">Name</label>
      <input type="text" class="form-control" required>
    </div>
    <div>
      <label class="form-label small fw-semibold">Email</label>
      <input type="email" class="form-control" required>
    </div>
    <div>
      <label class="form-label small fw-semibold">Phone</label>
      <input type="tel" class="form-control">
    </div>
    <div>
      <label class="form-label small fw-semibold">Subject</label>
      <input type="text" class="form-control" required>
    </div>
    <div>
      <label class="form-label small fw-semibold">Message</label>
      <textarea class="form-control" rows="4" required></textarea>
    </div>
    <button type="submit" class="btn btn-pw-primary">Send Message</button>
  </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();
    alert('Thanks! Contact form storage & admin inbox will be wired up in a later build stage.');
  });
</script>
</body>
</html>
