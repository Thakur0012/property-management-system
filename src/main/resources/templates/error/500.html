<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Went Wrong — PropertyWale</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="text-center">
    <div class="pw-display" style="font-size:5rem; color:var(--pw-red-600, #b3423a);">500</div>
    <h1 class="h4 mb-2">Something went wrong on our end</h1>
    <p class="text-secondary mb-4" th:text="${message} ?: 'Please try again in a moment.'">Error.</p>
    <a th:href="@{/}" class="btn btn-pw-primary">Back to Home</a>
  </div>
</body>
</html>
